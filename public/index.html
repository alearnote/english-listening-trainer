<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>English Listening Trainer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">AI LISTENING PRACTICE</p>
        <h1>English Listening Trainer</h1>
        <p class="sub">聞く → 書く → 採点 → 聞き直す</p>
      </div>
      <div class="streak">🎧 <span id="count">0</span> questions</div>
    </header>

    <section class="panel controls">
      <label>Level
        <select id="level">
          <option>A1</option><option>A2</option><option selected>B1</option>
          <option>B2</option><option>C1</option>
        </select>
      </label>
      <label>Topic
        <select id="topic">
          <option>Daily conversation</option>
          <option>Travel</option>
          <option>Work</option>
          <option>Shopping</option>
          <option>News-style conversation</option>
          <option>Medical English</option>
        </select>
      </label>
      <label>Length
        <select id="length">
          <option value="short">Short</option>
          <option value="medium">Medium</option>
          <option value="long">Long</option>
        </select>
      </label>
      <button id="newBtn" class="primary">＋ 新しい問題</button>
    </section>

    <section class="panel listen">
      <div class="section-title">
        <span>1</span><h2>Listen</h2>
      </div>

      <div class="play-row">
        <button id="playBtn" class="play" disabled>▶</button>
        <div>
          <div class="status" id="status">「新しい問題」を押してください</div>
          <div class="speed-row">
            <span>Speed</span>
            <button class="speed" data-speed="0.75">0.75×</button>
            <button class="speed" data-speed="0.9">0.9×</button>
            <button class="speed active" data-speed="1">1.0×</button>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="section-title">
        <span>2</span><h2>What did you hear?</h2>
      </div>
      <textarea id="answer" rows="4" placeholder="聞こえた英文をここに入力してください…" disabled></textarea>
      <button id="checkBtn" class="primary wide" disabled>採点する</button>
    </section>

    <section id="result" class="panel result hidden">
      <div class="score-wrap">
        <div class="score" id="score">0%</div>
        <div>
          <strong>Dictation score</strong>
          <p id="scoreMsg"></p>
        </div>
      </div>

      <div class="answer-box">
        <div class="label">YOUR ANSWER</div>
        <div id="yourAnswer"></div>
      </div>
      <div class="answer-box correct">
        <div class="label">CORRECT</div>
        <div id="correctAnswer"></div>
      </div>

      <details>
        <summary>日本語訳を見る</summary>
        <p id="translation"></p>
      </details>

      <div class="coach">
        <div class="label">AI COACH</div>
        <p id="feedback">解説を生成しています…</p>
        <ul id="focus"></ul>
      </div>

      <div class="tip">
        <strong>Listening tip</strong>
        <p id="tip"></p>
      </div>

      <div class="bottom-actions">
        <button id="replayBtn">↻ もう一度聞く</button>
        <button id="nextBtn" class="primary">次の問題 →</button>
      </div>
    </section>

    <audio id="audio"></audio>
  </main>

  <script src="app.js"></script>
</body>
</html>
